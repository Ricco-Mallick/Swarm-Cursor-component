name: Feature request
description: Suggest an option, effect or integration
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the use case behind it.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API (optional)
      render: html
